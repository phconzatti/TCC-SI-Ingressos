services:
  postgres:
    image: postgres:16
    container_name: bilheteria-postgres
    environment:
      POSTGRES_DB: bilheteria
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
    - "5432:5432"
    volumes:
    - pgdata:/var/lib/postgressql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d bilheteria"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata: