spring:
  application:
    name: bilheteria
  datasource:
    url: jdbc:postgresql://localhost:5432/bilheteria
    username: app
    password: app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: bilheteria-monolito
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

server:
  port: 8081
  shutdown: graceful

bilheteria:
  reservas:
    validade: PT15M
    intervalo-expiracao: PT30S
    expiracao-ativa: true
  pagamentos:
    gateway:
      latencia: PT0S
  seguranca:
    jwt:
      segredo: ${JWT_SEGREDO:segredo-de-desenvolvimento-troque-em-producao-0123456789abcdef}
      validade: PT1H
  usuarios:
    iniciais:
      ativo: true
      organizador-email: organizador@bilheteria.local
      organizador-senha: organizador-123
      portaria-email: portaria@bilheteria.local
      portaria-senha: portaria-123